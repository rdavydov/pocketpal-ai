name: Community auto release

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Build this ref, check upstream and release, or preview without publishing
        type: choice
        default: build
        options:
          - build
          - check
          - preview
          - verify-access

permissions:
  contents: read

concurrency:
  group: community-release-${{ github.repository }}${{ inputs.mode == 'verify-access' && '-access-check' || '' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'rdavydov/pocketpal-ai' && (github.event_name == 'schedule' || inputs.mode == 'check' || inputs.mode == 'preview')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.candidate.outputs.mode }}
      version: ${{ steps.candidate.outputs.version }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      base_sha: ${{ steps.candidate.outputs.base_sha }}
      tag: ${{ steps.candidate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
      - name: Prepare an update without changing remote main
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/apk/community-release.mjs prepare --root . --output "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.candidate.outputs.mode != 'no-update'
        with:
          name: community-candidate
          path: ${{ runner.temp }}/candidate/
          retention-days: 1
          if-no-files-found: error

  android:
    needs: prepare
    if: ${{ !cancelled() && github.repository == 'rdavydov/pocketpal-ai' && ((needs.prepare.result == 'skipped' && inputs.mode == 'build') || (needs.prepare.result == 'success' && needs.prepare.outputs.mode != 'no-update')) }}
    uses: ./.github/workflows/community-android.yml
    with:
      source_ref: ${{ github.sha }}
      candidate_artifact: ${{ needs.prepare.result == 'success' && 'community-candidate' || '' }}
      artifact_name: community-apk
      run_quality: true

  verify-access:
    if: github.repository == 'rdavydov/pocketpal-ai' && github.event_name == 'workflow_dispatch' && inputs.mode == 'verify-access'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # This explicit operator check uses only this workflow's revision, no candidate.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
      - name: Select the configured publisher credential
        id: auth
        env:
          RELEASE_TOKEN: ${{ secrets.COMMUNITY_RELEASE_TOKEN }}
          APP_CLIENT_ID: ${{ vars.COMMUNITY_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.COMMUNITY_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$RELEASE_TOKEN" ]; then
            echo 'method=pat' >> "$GITHUB_OUTPUT"
          elif [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo 'method=app' >> "$GITHUB_OUTPUT"
          else
            echo '::error::Configure COMMUNITY_RELEASE_TOKEN or the Community GitHub App'
            exit 1
          fi
      - name: Create the optional App token
        if: steps.auth.outputs.method == 'app'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.COMMUNITY_APP_CLIENT_ID }}
          private-key: ${{ secrets.COMMUNITY_APP_PRIVATE_KEY }}
          owner: rdavydov
          repositories: pocketpal-ai
          permission-contents: write
          permission-workflows: write
      - name: Verify publisher access using a disposable draft
        env:
          APP_TOKEN: ${{ secrets.COMMUNITY_RELEASE_TOKEN || steps.app.outputs.token }}
        run: node tools/apk/community-release.mjs verify-access --root . --output "$RUNNER_TEMP/access-check"
      - name: Retain the credential check report without credentials
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: community-access-check
          path: ${{ runner.temp }}/access-check/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: [prepare, android]
    if: ${{ github.repository == 'rdavydov/pocketpal-ai' && github.ref == 'refs/heads/main' && needs.prepare.result == 'success' && needs.prepare.outputs.mode != 'no-update' && (github.event_name == 'schedule' || inputs.mode == 'check') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Never execute candidate code with the App private key or write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: community-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: community-apk
          path: ${{ runner.temp }}/apk
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: community-apk-smoke
          path: ${{ runner.temp }}/smoke
      - name: Select the configured publisher credential
        id: auth
        env:
          RELEASE_TOKEN: ${{ secrets.COMMUNITY_RELEASE_TOKEN }}
          APP_CLIENT_ID: ${{ vars.COMMUNITY_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.COMMUNITY_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$RELEASE_TOKEN" ]; then
            echo 'method=pat' >> "$GITHUB_OUTPUT"
          elif [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo 'method=app' >> "$GITHUB_OUTPUT"
          else
            echo '::error::Configure COMMUNITY_RELEASE_TOKEN or the Community GitHub App; see tools/apk/CI-README-RU.md'
            exit 1
          fi
      - name: Create a short-lived publisher token after all tests
        id: app
        if: steps.auth.outputs.method == 'app'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.COMMUNITY_APP_CLIENT_ID }}
          private-key: ${{ secrets.COMMUNITY_APP_PRIVATE_KEY }}
          owner: rdavydov
          repositories: pocketpal-ai
          permission-contents: write
          permission-workflows: write
      - name: Promote the tested candidate and publish its APK
        env:
          APP_TOKEN: ${{ secrets.COMMUNITY_RELEASE_TOKEN || steps.app.outputs.token }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tools/apk/community-release.mjs publish --root . --candidate "$RUNNER_TEMP/candidate" --artifacts "$RUNNER_TEMP/apk" --smoke "$RUNNER_TEMP/smoke"
