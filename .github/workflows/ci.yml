name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Detect if changes are translation-only (src/locales/ files)
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      translation_only: ${{ steps.check.outputs.translation_only }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check if translation-only
        id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            CHANGED=$(git diff --name-only HEAD~1)
          fi

          echo "Changed files:"
          echo "$CHANGED"

          # Check if ALL changed files are under src/locales/
          TRANSLATION_ONLY="true"
          while IFS= read -r file; do
            if [ -z "$file" ]; then
              continue
            fi
            case "$file" in
              src/locales/*) ;;
              *) TRANSLATION_ONLY="false"; break ;;
            esac
          done <<< "$CHANGED"

          echo "translation_only=$TRANSLATION_ONLY" >> "$GITHUB_OUTPUT"
          echo "Translation only: $TRANSLATION_ONLY"

  # Job for linting, type checking, unit testing
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cache node_modules
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock', 'patches/**') }}

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.21.0'
          cache: 'yarn'

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      # Step 3: Install dependencies and iOS Pods
      - name: Install dependencies
        run: yarn install

      # Step 4: Validate l10n files
      - name: Validate l10n files
        run: node scripts/validate-l10n.js

      # Step 4b: Verify font registration (I8 — every fontFamily must
      # be bundled on iOS + Android + listed in Info.plist UIAppFonts).
      - name: Verify font registration
        run: node scripts/verify-fonts.js

      # Step 5: Run linters (ESLint)
      - name: Run ESLint
        run: yarn lint

      # Step 5: Run TypeScript type checks
      - name: Run TypeScript type check
        run: yarn typecheck

      # Step 6: Run unit tests (Jest)
      - name: Run unit tests
        run: |
          yarn test --coverage
          find tools/apk -name '*.test.mjs' -print0 | xargs -0 node --test

  # Render-count comparison of the PR merge commit against its base (main).
  # Restores the shared node_modules cache but never saves it: this job installs
  # other commits' dependencies and skips llama.rn's native postinstall.
  perf:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.translation_only != 'true'
    timeout-minutes: 30
    env:
      RNLLAMA_SKIP_POSTINSTALL: '1'
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.21.0'
          cache: 'yarn'

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Restore node_modules
        id: nm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock', 'patches/**') }}

      - name: Compare render performance with the base
        env:
          PERF_HEAD_INSTALL: ${{ steps.nm.outputs.cache-hit != 'true' && '1' || '' }}
        run: yarn test:perf:compare HEAD^1

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-perf
          path: .reassure/
          include-hidden-files: true

  # Reuse the same production APK build and smoke test as Community releases.
  build-android:
    needs: [build-and-test, detect-changes]
    if: needs.detect-changes.outputs.translation_only != 'true'
    uses: ./.github/workflows/community-android.yml
    with:
      source_ref: ${{ github.sha }}
      artifact_name: android-release-apk
      run_quality: false

  # Job for iOS build
  build-ios:
    runs-on: macos-26 # Keep CI on the same Xcode major as the release workflow
    needs: [build-and-test, detect-changes]
    if: github.repository == 'a-ghorbani/pocketpal-ai' && needs.detect-changes.outputs.translation_only != 'true'
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.21.0'
          cache: 'yarn'

      # Cache node_modules
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock', 'patches/**') }}

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install

      - name: Restore enriched-markdown native assets
        # A cached node_modules can hold a failed download. Run directly, the script
        # reads the app's "enriched-markdown" config only through INIT_CWD.
        run: INIT_CWD="$GITHUB_WORKSPACE" node node_modules/react-native-enriched-markdown/postinstall.mjs

      - name: Create Env.xcconfig
        run: |
          cat > ios/Config/Env.xcconfig << 'EOL'
          // This file contains environment-specific build settings.

          GOOGLE_WEB_CLIENT_ID = dummy-web-client-id.apps.googleusercontent.com
          REVERSED_GOOGLE_IOS_CLIENT_ID = com.googleusercontent.apps.dummy-ios-client-id

          EOL

      - name: Create dummy .env file for CI
        run: |
          cat > .env << 'EOL'
          FIREBASE_FUNCTIONS_URL=https://dummy-firebase-url.com

          # PalsHub/Supabase Configuration
          SUPABASE_URL=https://dummy-supabase-url.supabase.co
          SUPABASE_ANON_KEY=dummy-anon-key-for-ci-builds
          PALSHUB_API_BASE_URL=https://dummy-palshub-api.com

          # App Configuration
          APP_URL=pocketpal://app

          # Feature Flags (true/false)
          ENABLE_PALSHUB_INTEGRATION=true
          ENABLE_AUTHENTICATION=true
          ENABLE_OFFLINE_MODE=true

          # Google Sign-In Configuration
          GOOGLE_IOS_CLIENT_ID=dummy-ios-client-id.apps.googleusercontent.com
          GOOGLE_WEB_CLIENT_ID=dummy-web-client-id.apps.googleusercontent.com
          EOL

      - name: Create dummy GoogleService-Info.plist for CI
        run: |
          cat > ios/GoogleService-Info.plist << 'EOL'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CLIENT_ID</key>
            <string>dummy-client-id.apps.googleusercontent.com</string>
            <key>REVERSED_CLIENT_ID</key>
            <string>com.googleusercontent.apps.dummy-client-id</string>
            <key>API_KEY</key>
            <string>dummy-api-key-for-ci-builds</string>
            <key>GCM_SENDER_ID</key>
            <string>000000000000</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>ai.pocketpal</string>
            <key>PROJECT_ID</key>
            <string>dummy-project-for-ci</string>
            <key>STORAGE_BUCKET</key>
            <string>dummy-project-for-ci.appspot.com</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <false/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:0000000000000000</string>
          </dict>
          </plist>
          EOL

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
          cd ..

      - name: Select default Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Ensure Metal toolchain
        run: |
          xcrun -sdk iphoneos metal -v || xcodebuild -downloadComponent MetalToolchain

      - name: Build iOS Release
        run: |
          cd ios
          xcodebuild \
            -workspace PocketPal.xcworkspace \
            -scheme PocketPal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee ../ios-build.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::iOS build failed (exit $EXIT_CODE)"
            echo "::group::Error context"
            grep -B 5 -A 20 "error:" ../ios-build.log | tail -200 || tail -100 ../ios-build.log
            echo "::endgroup::"
            exit $EXIT_CODE
          fi

      - name: Verify iOS payload
        run: scripts/verify-ios-payload.sh ios/build/Build/Products/Release-iphoneos/PocketPal.app --require-marker

      - name: Verify the Plus store gate
        run: scripts/verify-plus-gate.sh ios/build/Build/Products/Release-iphoneos/PocketPal.app --ungated

      - name: AMX scan (llama-rn, whisper-rn, app executable)
        shell: bash -eo pipefail {0}
        run: |
          llvm_objdump="$(brew --prefix llvm 2>/dev/null || true)/bin/llvm-objdump"
          if [ -x "$llvm_objdump" ]; then objdump=("$llvm_objdump"); else objdump=(xcrun llvm-objdump); fi
          "${objdump[@]}" --version

          # Only undecoded words in AMX opcode space count (0x00201000 | op << 5 | operand):
          # jump tables inside __text also show as <unknown>.
          scan() {
            local counts
            counts=$("${objdump[@]}" -d --mattr=+all "$1" | awk '
              /<unknown>/ { raw++ }
              $1 ~ /^[0-9a-fA-F]+:$/ && $NF == "<unknown>" && tolower($2) ~ /^00201[0-3][0-9a-f][0-9a-f]$/ { amx++ }
              END { print raw + 0, amx + 0 }')
            read -r raw amx <<<"$counts"
            echo "$1: $raw <unknown>, $amx in AMX opcode space"
          }

          # A known AMX instruction must be flagged, or a clean scan proves nothing.
          printf '.text\n.globl _amx\n_amx:\n.inst 0x00201220\n' |
            xcrun clang -arch arm64 -x assembler -c - -o "$RUNNER_TEMP/amx.o"
          scan "$RUNNER_TEMP/amx.o"
          test "$amx" -gt 0

          for lib in llama-rn/libllama-rn.a whisper-rn/libwhisper-rn.a PocketPal.app/PocketPal; do
            lib="ios/build/Build/Products/Release-iphoneos/$lib"
            test -f "$lib"
            scan "$lib"
            test "$amx" -eq 0
          done

      - name: Symbol overlap (llama-rn, whisper-rn)
        run: |
          products=ios/build/Build/Products/Release-iphoneos
          scripts/verify-ios-symbol-overlap.sh --self-test "$products/llama-rn/libllama-rn.a" "$products/whisper-rn/libwhisper-rn.a"
